name: CerdikGo regression and installation checks

on:
  pull_request:
    branches: [main, "atlas9/**"]
  push:
    branches: [main, "qa/**", "atlas9/**"]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check installation prerequisites
        run: npm run doctor
      - name: Run regression tests
        run: npm test
