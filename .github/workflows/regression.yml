name: CerdikChat regression tests

on:
  pull_request:
    branches: [main, "feature/**", "security/**"]
  push:
    branches: [main, "qa/**", "security/**"]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: npm test
