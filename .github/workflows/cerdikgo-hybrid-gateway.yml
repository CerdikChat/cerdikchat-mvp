name: CerdikGo Hybrid Gateway Tests

on:
  push:
    branches:
      - atlas9/cerdikgo-multi-agent-evolution
    paths:
      - "integrations/**"
      - "mcp/**"
      - "mcp-preview/**"
      - "mcp-preview-worker.js"
      - "tests/**"
      - "worker.js"
      - "package.json"
      - "wrangler.toml"
      - "docs/MCP-*.md"
      - "docs/CHATGPT-GO-CONTEXT-BRIDGE.md"
      - ".github/workflows/cerdikgo-hybrid-gateway.yml"
  pull_request:
    paths:
      - "integrations/**"
      - "mcp/**"
      - "mcp-preview/**"
      - "mcp-preview-worker.js"
      - "tests/**"
      - "worker.js"
      - "package.json"
      - "wrangler.toml"
      - "docs/MCP-*.md"
      - "docs/CHATGPT-GO-CONTEXT-BRIDGE.md"
      - ".github/workflows/cerdikgo-hybrid-gateway.yml"

permissions:
  contents: read

jobs:
  unit-tests-and-worker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Validate Worker bundle without deployment
        run: npx --yes wrangler@4.153.0 deploy --dry-run --outdir /tmp/cerdikgo-worker-build
