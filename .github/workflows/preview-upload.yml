name: CerdikChat isolated branch Preview

on:
  push:
    branches:
      - atlas9/admin-governance-control-center
    paths:
      - "worker.js"
      - "src/**"
      - "auth/**"
      - "admin-portal.js"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/preview-upload.yml"

permissions:
  contents: read

concurrency:
  group: cerdikchat-branch-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized PR branch
        uses: actions/checkout@v4
        with:
          ref: atlas9/admin-governance-control-center
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: npm test
      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.153.0
      - name: Create or update isolated branch Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN repository secret is not configured"; exit 1; }
          npx wrangler preview --config wrangler.toml
