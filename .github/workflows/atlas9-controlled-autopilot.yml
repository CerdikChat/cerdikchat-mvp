name: ATLAS-9 Controlled Autopilot Guardrails

on:
  push:
    branches:
      - 'atlas9/**'
  pull_request:
    branches:
      - main
      - 'atlas9/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas9-controlled-autopilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-scope-and-regression:
    name: Feature scope and regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce feature-branch scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            candidate="$HEAD_REF"
          else
            candidate="$REF_NAME"
          fi
          if [[ "$candidate" != atlas9/* ]]; then
            echo "Blocked: ATLAS-9 automation is restricted to atlas9/* feature branches. Ref: $candidate"
            exit 1
          fi
          echo "Authorized feature branch: $candidate"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression suite
        run: npm test

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ATLAS-9 Controlled Autopilot Guardrails"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Ref: $GITHUB_REF"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Permissions: contents: read only"
            echo "- Actions: feature-scope validation and regression tests"
            echo "- Protected actions: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
