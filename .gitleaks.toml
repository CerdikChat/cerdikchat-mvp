title = "CerdikChat Gitleaks configuration"

[extend]
useDefault = true

# This exception is intentionally narrow: the exact localStorage namespace
# is application metadata, not an authentication credential or provider key.
[[rules]]
id = "generic-api-key"
description = "Generic API key detector with one reviewed localStorage namespace exception."
regex = '''(?i)[\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3.5
keywords = ["access", "api", "auth", "key", "credential", "creds", "passwd", "password", "secret", "token"]

[[rules.allowlists]]
description = "Only the reviewed non-secret Prompt Intelligence localStorage namespace."
condition = "AND"
paths = ['''(^|/)src/prompt-intelligence\.js$''']
regexTarget = "line"
regexes = ['''cerdikgo-prompt-vault-v1''']
