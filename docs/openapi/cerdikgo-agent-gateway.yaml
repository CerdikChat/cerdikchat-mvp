openapi: 3.1.0
info:
  title: CerdikGo Agent and MCP Gateway
  version: 0.2.0
  description: Authenticated plan-only agent API and stateless Streamable HTTP MCP endpoint.
servers:
  - url: https://{worker-host}
    variables:
      worker-host:
        default: example.workers.dev
security:
  - cerdikGoSession: []
paths:
  /api/agents/registry:
    get:
      operationId: getAgentRegistry
      summary: Read registered ATLAS specialist capabilities
      responses:
        '200':
          description: Registry and provider integration status
        '401':
          description: Authentication required
        '404':
          description: Feature flag disabled
  /api/agents/plan:
    post:
      operationId: createAgentPlan
      summary: Create a non-executing plan
      description: Does not invoke models, tools, external services, or database writes. controlled_action only marks the plan as awaiting human approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intent]
              properties:
                intent:
                  type: string
                  minLength: 1
                  maxLength: 4000
                agents:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    enum: [ATLAS-01, ATLAS-02, ATLAS-03, ATLAS-04, ATLAS-05, ATLAS-06, ATLAS-07, ATLAS-08, ATLAS-09]
                action_class:
                  type: string
                  enum: [read_only, controlled_action]
      responses:
        '200':
          description: Plan created; no action executed
        '400':
          description: Invalid plan input
        '401':
          description: Authentication required
        '403':
          description: Origin not allowed
        '404':
          description: Feature flag disabled
        '413':
          description: Request too large
        '429':
          description: Rate limit exceeded
  /mcp:
    post:
      operationId: cerdikgoMcpStreamableHttp
      summary: MCP Streamable HTTP endpoint
      description: Stateless MCP endpoint. Requires the Preview feature flag and dedicated bearer secret. Initial tools are read-only and plan-only; no provider inference or data mutation is exposed.
      security:
        - mcpBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: MCP JSON-RPC request envelope; exact schema is defined by the MCP protocol.
      responses:
        '200':
          description: MCP JSON-RPC response
        '401':
          description: Bearer token missing or invalid
        '404':
          description: MCP endpoint disabled
        '405':
          description: Unsupported HTTP method
        '429':
          description: Rate limit exceeded
        '503':
          description: MCP authentication secret not configured
components:
  securitySchemes:
    cerdikGoSession:
      type: apiKey
      in: cookie
      name: __Host-cerdikchat_session
    mcpBearer:
      type: http
      scheme: bearer
