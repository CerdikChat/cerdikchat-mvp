# CerdikGo isolated Worker configuration.
# Intentionally excludes D1, rate-limit namespaces, secrets, and scanner bindings
# until dedicated resources are provisioned and explicitly approved.

name = "atlas9-prompt-intelligence-mvp-cerdikchat-mvp"
main = "worker.js"
compatibility_date = "2026-10-27"
workers_dev = true

[assets]
directory = "./src"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "cerdikgo-readiness"
PRODUCT_ID = "cerdikgo"
