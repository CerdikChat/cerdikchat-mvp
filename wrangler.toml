
name = "cerdikchat-mvp"
main = "worker.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./src"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "2901029"

[ratelimits.simple]
limit = 20
period = 60

[[d1_databases]]
binding = "DB"
database_name = "cerdikchat-db"
database_id = "e5116f7b-53f0-4671-afca-28bfdc366ded"

# Preview-only observability: keep telemetry isolated and redact request query strings.
[previews.observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[previews.observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true

# Preview-only configuration: isolated from Production.
[previews.vars]
GOOGLE_CLIENT_ID = "845233224822-cs0fi5h189798hcvfmsdbkpnii0tu0un.apps.googleusercontent.com"
GOOGLE_AUTH_REQUIRED = "true"
ENVIRONMENT = "preview"

[previews.ai]
binding = "AI"

[[previews.ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "2901030"

[previews.ratelimits.simple]
limit = 20
period = 60

[[previews.d1_databases]]
binding = "DB"
database_name = "cerdikchat-staging"
database_id = "79267e63-e57f-4237-8b88-f1e477397771"
