
name = "cerdikchat-mvp"
main = "worker.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./src"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
OPENAI_MODEL = "gpt-5.5"

[observability]
enabled = true
head_sampling_rate = 1
