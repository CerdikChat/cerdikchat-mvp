
name = "cerdikchat-mvp"
main = "worker.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./src"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "2901029"

[ratelimits.simple]
limit = 20
period = 60
