<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
  <title id="title">ATLAS-9 mascot</title>
  <desc id="desc">A friendly white and electric-blue armored robot with a flowing blue cape, raising one hand in a thumbs-up pose.</desc>
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#dff6ff"/><stop offset=".78" stop-color="#8bcdf5"/><stop offset="1" stop-color="#397fc5"/></linearGradient>
    <linearGradient id="armorShade" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#f8fdff"/><stop offset=".55" stop-color="#a9ddfa"/><stop offset="1" stop-color="#3976b8"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4df4ff"/><stop offset=".42" stop-color="#087fe8"/><stop offset="1" stop-color="#073b91"/></linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20e7ff"/><stop offset=".45" stop-color="#087de0"/><stop offset="1" stop-color="#062e78"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#082957"/><stop offset="1" stop-color="#04152f"/></linearGradient>
    <radialGradient id="ground"><stop stop-color="#32dfff" stop-opacity=".35"/><stop offset="1" stop-color="#32dfff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <ellipse cx="320" cy="477" rx="220" ry="28" fill="url(#ground)"/>
  <ellipse cx="320" cy="474" rx="164" ry="13" fill="none" stroke="#3ddcff" stroke-width="3" opacity=".65"/>
